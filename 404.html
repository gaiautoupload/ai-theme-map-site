<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1020;
      color: #e8ecf3;
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 720px;
      background: #121933;
      border: 1px solid #26304f;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    h1 { margin-top: 0; color: #ffd166; }
    p { line-height: 1.7; }
    a { color: #8ecae6; }
    code { background: #0f1530; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>404：找不到頁面</h1>
    <p>這個網址目前沒有成功部署，或 GitHub Pages 尚未完成發布。</p>
    <p>你可以先回到首頁：<a href="/ai-theme-map-site/">LLM 投資決策 Wiki 平台</a></p>
    <p>若你是要測試新版頁面，請確認該路徑已實際發布，而不是被 404 掩蓋。</p>
    <p>目前建議檢查：<code>Pages 設定</code>、<code>部署狀態</code>、<code>實際輸出路徑</code>。</p>
  </div>
</body>
</html>
